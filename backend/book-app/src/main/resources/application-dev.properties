# Run the app on port 5000 for preview mode
server.port=5000

# Use in-memory H2 DB in dev to avoid external dependency and allow startup in preview mode
spring.datasource.url=jdbc:h2:mem:bookapp_dev;DB_CLOSE_DELAY=-1;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH
spring.datasource.username=sa
spring.datasource.password=sa
spring.datasource.driver-class-name=org.h2.Driver

# JPA/Hibernate schema management (validate to ensure migrations run if present; switch to update if needed)
spring.jpa.hibernate.ddl-auto=validate

# Disable Flyway in preview unless DB is persistent and migrations are required
spring.flyway.enabled=false

# H2 console (optional for local dev)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Logging
logging.level.org.hibernate.SQL=warn
logging.level.org.springframework=info

